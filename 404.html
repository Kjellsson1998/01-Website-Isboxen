<!DOCTYPE html>

    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FBF7EC" />

    <!-- OBS: absoluta sökvägar! GitHub Pages visar 404-sidan på vilken

  <body class="bg-cream font-sans text-choc antialiased overflow-x-hidden">
    <!-- Smältande kant – samma avdelare som på startsidan -->
    <svg class="hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="drip" viewBox="0 0 1440 80" preserveAspectRatio="none">

    <div class="flex min-h-screen flex-col">
      <main
        class="relative flex flex-1 flex-col items-center justify-center overflow-hidden px-6 py-16 text-center"
      >
        <!-- Strössel -->
        <span class="sprinkle bg-berry" style="left: 9%; top: 18%; --tilt: -24deg"></span>
        <span class="sprinkle bg-blueberry" style="left: 16%; top: 70%; --tilt: 38deg; animation-delay: -1.2s"></span>
        <span class="sprinkle bg-mango hidden sm:block" style="left: 28%; top: 36%; --tilt: 12deg; animation-delay: -2.4s"></span>
        <span class="sprinkle bg-grape" style="right: 10%; top: 22%; --tilt: -40deg; animation-delay: -0.8s"></span>
        <span class="sprinkle bg-mint" style="right: 18%; top: 64%; --tilt: 24deg; animation-delay: -1.8s"></span>
        <span class="sprinkle bg-frost hidden sm:block" style="right: 30%; top: 40%; --tilt: 50deg; animation-delay: -3s"></span>

        <img
          src="/01-Website-Isboxen/Image/isboxen-strut.webp"
          alt=""
          width="472"
          height="1201"
          decoding="async"
          class="tilt-r h-44 w-auto sm:h-56"
        />

        <h1 class="font-subheading mt-6 text-7xl text-berry sm:text-8xl">404</h1>

        <h2 class="font-subheading mt-3 text-2xl sm:text-3xl">
          Hoppsan! Sidan smälte visst bort.
        </h2>
        <p class="mx-auto mt-4 max-w-md text-base text-choc/75 sm:text-lg">
          Sidan du letade efter kunde inte hittas. Kanske tog den en glasspaus?
          Prova att gå tillbaka till startsidan.
        </p>

        <a
          href="/01-Website-Isboxen/"
          class="btn-pop mt-9 bg-berry text-base text-white sm:text-lg"
        >
          Till startsidan
        </a>
      </main>

      <!-- ============ SIDFOT ============ -->
      <footer class="bg-grape-deep text-cream">
        <div class="-mt-px text-cream" aria-hidden="true">
          <svg class="block h-10 w-full sm:h-14"><use href="#drip" /></svg>
        </div>

        <div class="mx-auto max-w-3xl px-6 py-10 text-center">
          <img
            src="/01-Website-Isboxen/Image/isboxen-logotyp.webp"
            alt="Isboxen"
            width="1400"
            height="641"
            loading="lazy"
            decoding="async"
            class="mx-auto h-14 w-auto"
          />

          <div class="mt-6">
            <p class="text-sm font-bold">Kontakta Hugo Kjellsson</p>
            <div class="mt-2 flex flex-col items-center gap-1">

              >
                hugo@kjellsson.nu
              </a>
              <a
                href="tel:+46703909051"
                class="text-sm font-bold text-mango hover:underline"
              >
                070-390 90 51
              </a>
